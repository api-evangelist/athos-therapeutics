aid: athos-therapeutics
name: Athos Therapeutics
description: 'Athos Therapeutics is a clinical-stage biopharmaceutical company in Torrance,
  California developing precision small-molecule therapeutics for autoimmune and chronic
  inflammatory diseases, led by co-founder and CEO Dr. Dimitrios Iliopoulos. Its AI/ML
  discovery platform integrates multi-omic patient data — genomics, transcriptomics,
  proteomics, epigenomics, metabolomics and microbiomics — collected with global hospital
  systems to identify novel drug and gene targets, and produced ATH-063, an AI-generated
  G9A methyltransferase inhibitor advancing in inflammatory bowel disease. The computational
  side of the business is commercialized through Chiron AI Labs (formerly AthosOmics.AI),
  a deliberately no-code omics analysis SaaS suite (Athos-Multi, Athos-T, Athos-P, Athos-G,
  Athos-PM) that is pre-launch and gated behind a demo waitlist. Athos publishes no
  public API, developer portal, SDK or machine-readable specification.'
